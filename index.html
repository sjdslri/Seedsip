<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سید اند سیپ – منو</title>
<meta name="theme-color" content="#F6F2EA">
<link rel="icon" id="fav" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#F6F2EA;--bg2:#EFE9DD;--card:#FFFFFF;
 --ink:#23362E;--mute:#66766E;--line:#E2DACB;
 --sage:#719589;--sage-d:#4C7164;--sage-l:#DCE7E1;
 --lime:#A6CB4B;--lime-d:#7FA02C;--lime-l:#EAF3CF;
 --warn:#B42318;
 --display:'Lalezar','Vazirmatn',Tahoma,sans-serif;
 --body:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
 --nav-h:110px;--r:22px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:var(--safe-b);overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--lime-d);outline-offset:2px;border-radius:10px}
img{display:block;max-width:100%}

/* ===== هیرو ===== */
.hero{position:relative;text-align:center;padding:calc(26px + var(--safe-t)) 20px 30px;
 background:
  radial-gradient(520px 260px at 85% -10%,rgba(166,203,75,.28),transparent 70%),
  radial-gradient(520px 300px at 8% 0%,rgba(113,149,137,.26),transparent 70%),
  var(--bg)}
.hero::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:26px;background:var(--bg);border-radius:26px 26px 0 0}
.logo{width:min(290px,66vw);height:auto;margin:0 auto;animation:rise .7s ease both}
.tag{margin:12px auto 0;max-width:34ch;color:var(--sage-d);font-weight:500;font-size:.98rem;animation:rise .7s .1s ease both}
.gear{position:absolute;top:calc(12px + var(--safe-t));inset-inline-start:12px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--sage-d);background:rgba(255,255,255,.6);border:1px solid var(--line);transition:.2s}
.gear:hover,.gear:focus-visible{background:#fff;transform:rotate(30deg)}

/* ===== نوار چسبان ===== */
.nav{position:sticky;top:0;z-index:30;background:rgba(246,242,234,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(10px + var(--safe-t)) 0 10px;border-bottom:1px solid var(--line)}
.nav-in{max-width:1100px;margin:auto;padding:0 16px;display:flex;flex-direction:column;gap:10px}
.search{position:relative;display:block}
.search svg{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);color:var(--sage-d);pointer-events:none}
.search input{width:100%;height:48px;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:0 46px 0 16px;font-size:1rem;color:var(--ink);transition:.2s;-webkit-appearance:none}
.search input:focus{border-color:var(--sage);box-shadow:0 0 0 4px rgba(113,149,137,.18);outline:none}
.search input::placeholder{color:#8B9A92}
.search input::-webkit-search-cancel-button{margin-inline-start:6px}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0;scroll-snap-type:x proximity}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;scroll-snap-align:center;padding:8px 18px;border-radius:99px;background:#fff;border:1.5px solid var(--line);color:var(--ink);font-size:.95rem;font-weight:500;transition:.2s;white-space:nowrap;min-height:40px}
.pill:hover{border-color:var(--sage)}
@media(min-width:760px){.nav-in{flex-direction:row;align-items:center;gap:16px}.search{flex:0 0 280px}.pills{flex:1}}
.pill.on{background:var(--sage-d);border-color:var(--sage-d);color:#fff;font-weight:700}

/* ===== منو ===== */
main{max-width:1100px;margin:auto;padding:6px 16px 40px}
.cat{padding-top:26px;scroll-margin-top:calc(var(--nav-h) + 4px)}
.cat-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cat-h h2{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.2;color:var(--sage-d)}
.cat-h .dot{width:12px;height:12px;border-radius:50% 50% 50% 0;background:var(--lime);transform:rotate(-45deg);flex:none}
.cat-h::after{content:"";flex:1;height:2px;background:linear-gradient(to left,var(--sage),transparent);opacity:.35;border-radius:2px}
.cat-h small{color:var(--mute);font-size:.82rem;order:3}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:16px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}

/* موبایل: ردیف افقی – دسکتاپ: کارت عمودی */
.card{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:row;align-items:stretch;gap:12px;padding:10px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(60,80,70,.06);transition:transform .25s,box-shadow .25s;animation:rise .5s ease both}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(60,80,70,.14)}
.ph{flex:none;width:92px;height:92px;border-radius:16px;background:var(--sage-l);display:grid;place-items:center;overflow:hidden;position:relative;align-self:center}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:46%;opacity:.8}
.body{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;padding:2px 2px}
.name{font-weight:700;font-size:1.02rem;line-height:1.5}
.desc{font-size:.82rem;color:var(--mute);line-height:1.65}
.price{margin-top:auto;padding-top:6px;font-weight:800;color:var(--sage-d);font-size:1.08rem}
.price small{font-weight:500;font-size:.75rem;margin-inline-start:4px;color:var(--mute)}
.out{background:#FAF8F3}
.out .ph img,.out .ph svg{filter:grayscale(1);opacity:.4}
.out .name,.out .desc{opacity:.55}
.out .price{text-decoration:line-through;color:var(--mute)}
.badge{position:absolute;inset:auto 0 0 0;background:rgba(35,54,46,.82);color:#fff;font-size:.72rem;text-align:center;padding:1px 0;font-weight:500}
@media(min-width:640px){
 .card{flex-direction:column;padding:0;gap:0}
 .ph{width:100%;height:auto;aspect-ratio:4/3;border-radius:0;align-self:stretch}
 .body{padding:12px 14px 14px}
 .badge{inset:10px auto auto 10px;border-radius:99px;padding:1px 12px}
}
.empty{text-align:center;padding:60px 20px;color:var(--mute)}
.empty svg{width:84px;margin:0 auto 14px;display:block}
.empty h3{font-family:var(--display);font-weight:400;font-size:1.8rem;color:var(--sage-d)}
.mini-empty{background:var(--bg2);border:1.5px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--mute);font-size:.9rem}
footer{text-align:center;color:var(--mute);font-size:.86rem;padding:26px 18px calc(40px + var(--safe-b));white-space:pre-line;border-top:1px solid var(--line);max-width:1100px;margin:0 auto}
footer .leaf{width:30px;margin:0 auto 10px;display:block}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ===== دکمه‌ها و فرم‌ها ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--sage-d);color:#fff;padding:0 22px;min-height:46px;border-radius:99px;font-weight:700;font-size:.95rem;transition:.2s}
.btn:hover{background:#3d5c50}
.btn.lime{background:var(--lime);color:#1d2b10}
.btn.lime:hover{background:#b5d95e}
.btn.ghost{background:var(--bg2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--sage-l)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.84rem}
.btn.danger{background:var(--warn);color:#fff}
.btn.block{width:100%}
dialog{border:0;border-radius:26px;padding:0;background:var(--bg);color:var(--ink);width:min(500px,94vw);max-height:92dvh;box-shadow:0 30px 80px rgba(20,40,30,.4);font-family:var(--body);overflow:auto}
dialog::backdrop{background:rgba(20,34,28,.6);backdrop-filter:blur(3px)}
dialog[open]{animation:pop .22s ease}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}
@media(max-width:560px){
 #dlg{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:26px 26px 0 0;max-height:94dvh}
}
.dform{padding:22px;display:flex;flex-direction:column;gap:14px}
.dform h3,.pform h3{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.3;color:var(--sage-d)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.86rem;font-weight:500;color:var(--mute)}
.dform input[type=text],.dform input[type=password],.dform textarea,.dform select,.pform input[type=text],.pform input[type=password],.pform textarea,.pform select,.pfilter input,.pfilter select{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;min-height:46px;color:var(--ink);width:100%;font-size:1rem}
.dform input:focus,.dform textarea:focus,.dform select:focus,.pform input:focus,.pform textarea:focus,.pform select:focus,.pfilter input:focus,.pfilter select:focus{border-color:var(--sage);outline:none;box-shadow:0 0 0 4px rgba(113,149,137,.18)}
textarea{resize:vertical;min-height:76px}
.row2{display:flex;gap:10px;flex-wrap:wrap}.row2>*{flex:1;min-width:130px}
.end{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}
.end .btn{flex:1}
.thumb{width:100%;aspect-ratio:16/9;border-radius:16px;background:var(--sage-l);overflow:hidden;display:grid;place-items:center;color:var(--mute);font-size:.88rem}
.thumb img{width:100%;height:100%;object-fit:cover}
.err{color:var(--warn);font-size:.86rem;min-height:1.2em}
.hint{font-size:.8rem;color:var(--mute);font-weight:400}
.pricepv{font-weight:700;color:var(--sage-d);font-size:.88rem;min-height:1.4em}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:500}
.sw input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:99px;background:#C7CFCB;position:relative;transition:.2s;cursor:pointer;flex:none}
.sw input::after{content:"";position:absolute;top:3px;inset-inline-end:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked{background:var(--sage-d)}
.sw input:checked::after{inset-inline-end:25px}
.toast{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:10px 22px;border-radius:99px;font-size:.92rem;opacity:0;pointer-events:none;transition:.3s;z-index:9999;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== پنل مدیریت ===== */
#panel{width:min(900px,100vw);height:min(92dvh,800px);padding:0;overflow:hidden}
#panel[open]{display:flex;flex-direction:column}
@media(max-width:700px){#panel{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0}}
.pbar{background:var(--sage-d);color:#fff;padding:calc(12px + var(--safe-t)) 16px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pbar h2{font-family:var(--display);font-weight:400;font-size:1.5rem}
.pbar .x{margin-inline-start:auto;background:rgba(255,255,255,.18);border-radius:99px;padding:6px 16px;font-size:.88rem;font-weight:500;min-height:36px}
.tabs{display:flex;gap:4px;width:100%}
.tab{flex:1;padding:11px 8px;border-radius:14px 14px 0 0;color:rgba(255,255,255,.8);font-weight:500;font-size:.95rem;white-space:nowrap}
.tab.on{background:var(--bg);color:var(--sage-d);font-weight:800}
.pbody{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.pfoot{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);background:var(--bg);display:flex;gap:10px}
.pfoot .btn{flex:1}
.pfilter{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pfilter input{flex:2;min-width:150px}.pfilter select{flex:1;min-width:130px}
.li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:8px 10px;margin-bottom:8px;border:1px solid var(--line);cursor:pointer;transition:.15s}
.li:hover{border-color:var(--sage)}
.li.off .lt,.li.off .lm{opacity:.55}
.lt{width:54px;height:54px;flex:none;border-radius:14px;background:var(--sage-l);overflow:hidden;display:grid;place-items:center}
.lt img{width:100%;height:100%;object-fit:cover}.lt svg{width:55%}
.lm{flex:1;min-width:0}
.lm b{display:block;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lm small{color:var(--mute);font-size:.8rem}
.la{display:flex;gap:6px;align-items:center}
.ib{width:38px;height:38px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:.8rem;color:var(--ink);flex:none}
.ib:hover{background:var(--lime);color:#1d2b10}
.mini-sw{appearance:none;-webkit-appearance:none;width:46px;height:27px;border-radius:99px;background:#C7CFCB;position:relative;transition:.2s;cursor:pointer;flex:none}
.mini-sw::after{content:"";position:absolute;top:3px;inset-inline-end:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.mini-sw:checked{background:var(--sage-d)}
.mini-sw:checked::after{inset-inline-end:22px}
@media(max-width:480px){.li .mv{display:none}}
.pform{display:flex;flex-direction:column;gap:14px;max-width:560px}
.pform .sep{height:1px;background:var(--line)}
.sect{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}

@media print{
 body{background:#fff}.nav,.gear,.toast,.hero::after{display:none!important}.hero{background:#fff;padding-bottom:10px}
 .card{box-shadow:none;animation:none;break-inside:avoid}.grid{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

 <img class="logo" id="logo" alt="Seed &amp; Sip – A café for ideas, trade, taste, and growth" width="571" height="437">
 <p class="tag" id="bt"></p>
</header>
<nav class="nav" id="nav" aria-label="منو">
 <div class="nav-in">
  <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="جستجو در منو…" aria-label="جستجو در منو" enterkeyhint="search" autocomplete="off"></label>
  <div class="pills" id="pills"></div>
 </div>
</nav>
<main id="menu"></main>

<dialog id="panel"></dialog>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

const KEY='seedsip.fa.v1';
const LEAF='<svg viewBox="0 0 64 64" fill="none" stroke="#719589" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M32 54V30M32 32c0-10 6-16 17-16 0 10-6 16-17 16zM32 40c0-8-5-12-13-12 0 8 5 12 13 12z"/></svg>';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const digits=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٬,،\s]/g,'').replace('٫','.');
const I=(n,d,p,a=true)=>({id:uid(),name:n,desc:d,price:String(p),img:'',avail:a});
const seed=()=>({pass:'seedsip2024',cur:'تومان',name:'Seed & Sip',tag:'کافه‌ای برای ایده، تجارت، طعم و رشد',foot:'ساعت کاری: هر روز ۸ صبح تا ۱۱ شب\nقیمت‌ها به تومان و با احتساب مالیات است.',cats:[
 {id:uid(),name:'قهوه',items:[I('اسپرسو','دبل شات، غلیظ و خوش‌عطر',95000),I('فلت وایت','شیر بخارداده‌شده روی ریستررتو',140000),I('کلد برو','۱۸ ساعت دم‌آوری، سرو با یخ',155000)]},
 {id:uid(),name:'نوشیدنی‌های خنک',items:[I('لیموناد نعنا','لیمو تازه و نعنای محلی',120000),I('اسموتی انبه','انبه، موز و ماست یونانی',165000)]},
 {id:uid(),name:'صبحانه و دسر',items:[I('تست آووکادو','نان خمیرترش، لیمو و دانه‌ها',210000),I('کروسان بادام','هر صبح پخته می‌شود',130000,false)]}
]});
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.cats)){delete d.logo;return d}}catch(e){}return seed()}
let S=load(),term='',tab='prod',fc='all',pq='';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('حافظه پر است. از عکس کوچک‌تر یا لینک تصویر استفاده کنید.');return false}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
const fa=n=>n.toLocaleString('fa-IR');
const fmt=p=>{const n=parseFloat(digits(p));return p!==''&&!isNaN(n)?`${fa(n)}<small>${esc(S.cur)}</small>`:esc(p)};
const money=p=>{const n=parseFloat(digits(p));return isNaN(n)?esc(p):fa(n)+' '+esc(S.cur)};

/* لوگو و فاوآیکن */
$('#logo').src=LOGO;$('#fav').href=LOGO;

/* ===== منوی عمومی ===== */
function navH(){document.documentElement.style.setProperty('--nav-h',$('#nav').offsetHeight+'px')}
function render(){
 $('#bt').textContent=S.tag||'';$('#foot').textContent=S.foot||'';
 $('#logo').alt=S.name;document.title=S.name+' – منو';
 const t=term.trim().toLowerCase(),m=$('#menu');
 const cats=S.cats.map(c=>({...c,vis:t?c.items.filter(i=>(i.name+' '+(i.desc||'')).toLowerCase().includes(t)):c.items})).filter(c=>!t||c.vis.length);
 $('#pills').innerHTML=cats.map(c=>`<button class="pill" data-a="go" data-id="${c.id}">${esc(c.name)}</button>`).join('');
 $('#pills').style.display=cats.length?'':'none';
 if(!S.cats.length){m.innerHTML=`<div class="empty">${LEAF}<h3>منو در حال رشد است</h3><p>به‌زودی اینجا پر می‌شود.</p></div>`;navH();return}
 if(!cats.length){m.innerHTML=`<div class="empty">${LEAF}<h3>موردی برای «${esc(term)}» پیدا نشد</h3><p>کلمه دیگری را امتحان کنید.</p></div>`;navH();return}
 m.innerHTML=cats.map(c=>`<section class="cat" id="c-${c.id}" data-id="${c.id}"><div class="cat-h"><span class="dot"></span><h2>${esc(c.name)}</h2></div>
  ${c.vis.length?`<div class="grid">${c.vis.map(card).join('')}</div>`:'<div class="mini-empty">محصولات این دسته به‌زودی اضافه می‌شود.</div>'}</section>`).join('');
 navH();spy();
}
const card=i=>`<article class="card ${i.avail?'':'out'}"><div class="ph">${i.img?`<img src="${esc(i.img)}" alt="${esc(i.name)}" loading="lazy" onerror="this.remove()">`:LEAF}${i.avail?'':'<span class="badge">ناموجود</span>'}</div><div class="body"><div class="name">${esc(i.name)}</div>${i.desc?`<div class="desc">${esc(i.desc)}</div>`:''}<div class="price">${fmt(i.price)}</div></div></article>`;
let io;
function spy(){
 if(io)io.disconnect();const pills=[...document.querySelectorAll('.pill')];
 if(!pills.length||!('IntersectionObserver' in window))return;
 const h=$('#nav').offsetHeight;
 io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)pills.forEach(p=>{const on=p.dataset.id===e.target.dataset.id;p.classList.toggle('on',on);if(on){const bx=$('#pills');bx.scrollTo({left:p.offsetLeft-bx.clientWidth/2+p.clientWidth/2-(bx.scrollWidth>0?0:0),behavior:'smooth'})}})}),{rootMargin:`-${h+10}px 0px -65% 0px`});
 document.querySelectorAll('.cat').forEach(s=>io.observe(s));pills[0].classList.add('on');
}
addEventListener('resize',navH);

/* ===== دیالوگ‌ها ===== */
const dlg=$('#dlg'),P=$('#panel');
function open(html,onSubmit){dlg.innerHTML=`<form class="dform" method="dialog">${html}</form>`;const f=dlg.firstChild;f.onsubmit=e=>{e.preventDefault();if(onSubmit(new FormData(f),f)!==false)dlg.close()};f.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>dlg.close());dlg.showModal();const a=f.querySelector('input[type=text],input[type=password]');a&&matchMedia('(hover:hover)').matches&&a.focus();return f}
const ends=(l='ذخیره')=>`<div class="end"><button class="btn">${l}</button><button type="button" class="btn ghost" data-close>انصراف</button></div>`;
const confirmBox=(msg,fn,l='حذف')=>{const f=open(`<h3>${esc(msg)}</h3><p class="hint">این کار قابل بازگشت نیست.</p>${ends(l)}`,()=>{fn()});f.querySelector('.btn').classList.add('danger')};
function shrink(file,max,q){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}

function login(){open(`<h3>ورود مدیر</h3><label class="f">رمز عبور<input type="password" name="p" autocomplete="current-password" dir="ltr"></label><div class="err" id="er"></div>${ends('ورود')}`,(fd,f)=>{
 if(fd.get('p')===S.pass){try{sessionStorage.setItem('ss_admin','1')}catch(e){}openPanel()}else{f.querySelector('#er').textContent='رمز عبور درست نیست.';return false}})}
function gear(){let ok=false;try{ok=sessionStorage.getItem('ss_admin')==='1'}catch(e){}ok?openPanel():login()}

/* ===== پنل مدیریت ===== */
function openPanel(){if(!P.open)P.showModal();panel()}
function panel(){
 const T=[['prod','محصولات'],['cat','دسته‌بندی‌ها'],['set','تنظیمات']];
 const foot=tab==='prod'&&S.cats.length?`<div class="pfoot"><button class="btn lime" data-p="additem">+ افزودن محصول</button></div>`:tab==='cat'?`<div class="pfoot"><button class="btn lime" data-p="addcat">+ افزودن دسته‌بندی</button></div>`:'';
 const keep=P.querySelector('.pbody')?.scrollTop||0;
 P.innerHTML=`<div class="pbar"><h2>پنل مدیریت</h2><button class="x" data-p="close">بستن ✕</button><div class="tabs" role="tablist">${T.map(t=>`<button class="tab ${tab===t[0]?'on':''}" role="tab" data-p="tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</div></div><div class="pbody">${({prod:prodTab,cat:catTab,set:setTab})[tab]()}</div>${foot}`;
 P.querySelector('.pbody').scrollTop=keep;
}
function prodTab(){
 if(!S.cats.length)return `<div class="empty">${LEAF}<h3>اول یک دسته‌بندی بسازید</h3><button class="btn lime" data-p="addcat" style="margin-top:12px">افزودن دسته‌بندی</button></div>`;
 if(fc!=='all'&&!S.cats.some(c=>c.id===fc))fc='all';
 const q=pq.trim().toLowerCase();
 const rows=S.cats.filter(c=>fc==='all'||c.id===fc).flatMap(c=>c.items.map(i=>({c,i}))).filter(({i})=>!q||(i.name+' '+(i.desc||'')).toLowerCase().includes(q));
 return `<div class="pfilter"><input type="text" id="pq" placeholder="جستجوی محصول…" value="${esc(pq)}" aria-label="جستجوی محصول"><select data-p="fc" aria-label="فیلتر دسته"><option value="all">همه دسته‌ها</option>${S.cats.map(c=>`<option value="${c.id}" ${fc===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
 <p class="hint" style="margin-bottom:10px">روی هر محصول بزنید تا ویرایش شود. با کلید کنار آن، موجود/ناموجود را عوض کنید.</p>`+
 (rows.length?rows.map(({c,i})=>`<div class="li ${i.avail?'':'off'}" data-p="edit" data-c="${c.id}" data-id="${i.id}"><div class="lt">${i.img?`<img src="${esc(i.img)}" alt="" onerror="this.remove()">`:LEAF}</div><div class="lm"><b>${esc(i.name)}</b><small>${esc(c.name)} · ${money(i.price)}</small></div><div class="la">
  <input type="checkbox" class="mini-sw" data-p="tog" data-c="${c.id}" data-id="${i.id}" ${i.avail?'checked':''} aria-label="موجود بودن ${esc(i.name)}">
  <button class="ib mv" data-p="iup" data-c="${c.id}" data-id="${i.id}" aria-label="بالا">▲</button><button class="ib mv" data-p="idn" data-c="${c.id}" data-id="${i.id}" aria-label="پایین">▼</button></div></div>`).join(''):`<div class="empty">${LEAF}<h3>${q?'موردی پیدا نشد':'هنوز محصولی نیست'}</h3><p>${q?'کلمه دیگری را امتحان کنید.':'با دکمه «افزودن محصول» شروع کنید.'}</p></div>`);
}
function catTab(){
 return (S.cats.length?S.cats.map(c=>`<div class="li" data-p="editcat" data-id="${c.id}"><div class="lm"><b>${esc(c.name)}</b><small>${fa(c.items.length)} محصول</small></div><div class="la">
 <button class="ib" data-p="cup" data-id="${c.id}" aria-label="بالا">▲</button><button class="ib" data-p="cdn" data-id="${c.id}" aria-label="پایین">▼</button>
 <button class="ib" data-p="delcat" data-id="${c.id}" aria-label="حذف">🗑</button></div></div>`).join(''):`<div class="mini-empty">دسته‌بندی‌ای وجود ندارد.</div>`)+`<p class="hint" style="margin-top:8px">روی نام دسته بزنید تا تغییر نام دهید.</p>`;
}
function setTab(){
 return `<div class="sect"><form class="pform" data-f="info"><h3>اطلاعات کافه</h3>
 <label class="f">نام کافه<input type="text" name="name" value="${esc(S.name)}" required maxlength="40"></label>
 <label class="f">شعار<input type="text" name="tag" value="${esc(S.tag)}" maxlength="90"></label>
 <label class="f">متن پایین منو (ساعت کاری، آدرس، تلفن، اینستاگرام)<textarea name="foot" maxlength="400">${esc(S.foot)}</textarea></label>
 <label class="f">واحد پول<input type="text" name="cur" value="${esc(S.cur)}" maxlength="10"></label>
 <button class="btn">ذخیره اطلاعات</button></form></div>
 <div class="sect"><form class="pform" data-f="pass"><h3>رمز عبور</h3><label class="f">رمز جدید<input type="password" name="w" dir="ltr" placeholder="رمز جدید را وارد کنید" required autocomplete="new-password"></label><button class="btn ghost" style="align-self:flex-start">تغییر رمز</button>
 <p class="hint">رمز فقط جلوی کنجکاوی عادی را می‌گیرد؛ چون در مرورگر ذخیره می‌شود. از رمز مهم خود استفاده نکنید.</p></form></div>
 <div class="sect"><div class="pform"><h3>پشتیبان‌گیری</h3><p class="hint">اطلاعات منو فقط در همین مرورگر ذخیره می‌شود. برای انتقال به دستگاه دیگر، پشتیبان بگیرید.</p>
 <div class="row2"><button class="btn ghost" data-p="ex">دریافت فایل پشتیبان</button><button class="btn ghost" data-p="im">بازیابی از فایل</button></div><input type="file" id="imf" accept="application/json" hidden>
 <div class="sep"></div><div class="row2"><button class="btn ghost" data-p="logout">خروج از حالت مدیر</button><button class="btn danger" data-p="rs">بازگشت به منوی نمونه</button></div></div></div>`;
}
function catForm(c){open(`<h3>${c?'تغییر نام دسته‌بندی':'دسته‌بندی جدید'}</h3><label class="f">نام دسته‌بندی<input type="text" name="n" required maxlength="40" value="${esc(c?.name||'')}"></label>${ends()}`,fd=>{
 const n=fd.get('n').trim();if(!n)return false;if(c)c.name=n;else S.cats.push({id:uid(),name:n,items:[]});save();render();panel();toast('ذخیره شد')})}
function itemForm(cat,it){
 const d=it||{name:'',desc:'',price:'',img:'',avail:true};let data=d.img&&d.img.startsWith('data:')?d.img:'';
 const f=open(`<h3>${it?'ویرایش محصول':'محصول جدید'}</h3>
 <label class="f">نام محصول<input type="text" name="n" required maxlength="60" value="${esc(d.name)}"></label>
 <div class="row2"><label class="f">قیمت (${esc(S.cur)})<input type="text" name="p" inputmode="numeric" placeholder="مثلاً ۱۲۰۰۰۰" value="${esc(d.price)}"><span class="pricepv" id="pp"></span></label>
 <label class="f">دسته‌بندی<select name="c">${S.cats.map(c=>`<option value="${c.id}" ${c===cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label></div>
 <label class="f">توضیح کوتاه (اختیاری)<textarea name="d" maxlength="140">${esc(d.desc||'')}</textarea></label>
 <div class="thumb" id="th">${d.img?`<img src="${esc(d.img)}" alt="">`:'بدون عکس'}</div>
 <div class="row2"><label class="btn ghost sm" style="cursor:pointer">📷 انتخاب عکس<input type="file" accept="image/*" id="fl" hidden></label><button type="button" class="btn ghost sm" id="rm">حذف عکس</button></div>
 <label class="f">یا لینک تصویر (اختیاری)<input type="text" name="u" dir="ltr" placeholder="https://…" value="${data?'':esc(d.img)}"></label>
 <label class="sw">موجود است<input type="checkbox" name="a" ${d.avail?'checked':''}></label>
 ${ends()}${it?'<button type="button" class="btn danger sm" id="del" style="align-self:center">حذف این محصول</button>':''}`,fd=>{
  const o={name:fd.get('n').trim(),price:digits(fd.get('p')),desc:fd.get('d').trim(),avail:fd.get('a')==='on',img:data||fd.get('u').trim()};
  if(!o.name)return false;const to=S.cats.find(c=>c.id===fd.get('c'))||cat;
  if(it){Object.assign(it,o);if(to!==cat){cat.items=cat.items.filter(x=>x!==it);to.items.push(it)}}else to.items.push({id:uid(),...o});
  if(!save())return false;render();panel();toast('ذخیره شد')});
 const th=f.querySelector('#th'),pi=f.querySelector('[name=p]'),pp=f.querySelector('#pp');
 const pv=()=>{const n=parseFloat(digits(pi.value));pp.textContent=pi.value&&!isNaN(n)?money(pi.value):''};pi.addEventListener('input',pv);pv();
 f.querySelector('#fl').onchange=e=>{const x=e.target.files[0];if(x)shrink(x,640,.82).then(u=>{data=u;f.querySelector('[name=u]').value='';th.innerHTML=`<img src="${u}" alt="">`})};
 f.querySelector('[name=u]').oninput=e=>{if(e.target.value){data='';th.innerHTML=`<img src="${esc(e.target.value)}" alt="" onerror="this.remove()">`}};
 f.querySelector('#rm').onclick=()=>{data='';f.querySelector('[name=u]').value='';th.textContent='بدون عکس'};
 const dl=f.querySelector('#del');if(dl)dl.onclick=()=>{dlg.close();confirmBox(`«${it.name}» حذف شود؟`,()=>{cat.items=cat.items.filter(i=>i!==it);save();render();panel();toast('حذف شد')})};
}
const mv=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render();panel()};
P.addEventListener('click',e=>{
 const b=e.target.closest('[data-p]');if(!b||b.tagName==='SELECT')return;
 if(e.target.closest('.la')&&b.classList.contains('li')&&!e.target.closest('[data-p="edit"]:not(.li)')&&e.target.closest('[data-p]')===b&&e.target.closest('.la'))return;
 const a=b.dataset.p,cat=S.cats.find(c=>c.id===(b.dataset.c||b.dataset.id)),it=cat&&cat.items.find(i=>i.id===b.dataset.id);
 if(a==='tog'){e.stopPropagation();it.avail=b.checked;save();render();panel();return}
 ({close:()=>P.close(),tab:()=>{tab=b.dataset.id;panel()},addcat:()=>catForm(),editcat:()=>catForm(cat),
 delcat:()=>confirmBox(`دسته «${cat.name}» و ${fa(cat.items.length)} محصول آن حذف شود؟`,()=>{S.cats=S.cats.filter(c=>c!==cat);save();render();panel();toast('حذف شد')}),
 cup:()=>mv(S.cats,S.cats.indexOf(cat),-1),cdn:()=>mv(S.cats,S.cats.indexOf(cat),1),
 additem:()=>itemForm(S.cats.find(c=>c.id===fc)||S.cats[0]),edit:()=>itemForm(cat,it),
 iup:()=>mv(cat.items,cat.items.indexOf(it),-1),idn:()=>mv(cat.items,cat.items.indexOf(it),1),
 ex:()=>{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));l.download='seed-and-sip-menu.json';l.click()},
 im:()=>$('#imf').click(),
 rs:()=>confirmBox('کل منو به نمونه اولیه برگردد؟',()=>{const p=S.pass;S=seed();S.pass=p;save();render();panel();toast('منو بازنشانی شد')},'بازنشانی'),
 logout:()=>{try{sessionStorage.removeItem('ss_admin')}catch(_){}P.close();toast('از حالت مدیر خارج شدید')}})[a]?.();
});
P.addEventListener('input',e=>{if(e.target.id==='pq'){pq=e.target.value;const pos=e.target.selectionStart;panel();const n=P.querySelector('#pq');n.focus();n.setSelectionRange(pos,pos)}});
P.addEventListener('change',e=>{
 if(e.target.dataset.p==='fc'){fc=e.target.value;panel()}
 if(e.target.id==='imf'){const x=e.target.files[0];if(x)x.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.cats))throw 0;delete d.logo;S=d;save();render();panel();toast('پشتیبان بازیابی شد')}catch(_){toast('فایل پشتیبان معتبر نیست.')}})}
});
P.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f);
 if(f.dataset.f==='info'){S.name=fd.get('name').trim()||S.name;S.tag=fd.get('tag').trim();S.foot=fd.get('foot').trim();S.cur=fd.get('cur').trim()||S.cur;if(save()){render();panel();toast('اطلاعات ذخیره شد')}}
 if(f.dataset.f==='pass'){S.pass=fd.get('w').trim();save();f.reset();toast('رمز عبور تغییر کرد')}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
 if(b.dataset.a==='gear')gear();if(b.dataset.a==='go'){const s=$('#c-'+b.dataset.id);s&&s.scrollIntoView({behavior:'smooth'})}});
$('#q').addEventListener('input',e=>{term=e.target.value;render()});
if(location.hash==='#admin')setTimeout(gear,300);
render();
</script>
</body>
</html>
